# ==============================================================================================
# nginx do Nainer — 4 hosts, TLS por Let's Encrypt (HTTP-01), API atrás de proxy.
#
# ⚠️ ESTE VPS RODA OUTROS PROJETOS. Se já existe nginx (ou Traefik) usando 80/443, NÃO instale
# outro: acrescente estes server blocks ao que já roda (ou traduza para o proxy existente).
# Rodar dois na mesma porta simplesmente não sobe, e o erro aparece só no restart.
#
# Trocar em todo o arquivo: nainer.com.br pelo domínio final; 8080 pela porta escolhida para a API.
# Caminhos dos estáticos: /var/www/nainer/{site,web,admin} (saída de `npm run build` de cada front).
# ==============================================================================================

# Limite de requisição no PROXY — primeira camada, antes de a API existir para o atacante.
# A segunda camada é o LimiteRequisicaoFilter, dentro da aplicação.
limit_req_zone $binary_remote_addr zone=publico:10m rate=60r/m;   # signup, formulário de lead
limit_req_zone $binary_remote_addr zone=beacon:10m  rate=240r/m;  # medição (envia em lote)
limit_req_zone $binary_remote_addr zone=geral:10m   rate=600r/m;  # ERP autenticado

# Por padrão o nginx recusa com 503 e uma página HTML. Duas consequências ruins, as duas
# observadas em produção no primeiro dia (2026-08-19):
#   · 503 diz "servidor com problema" quando o certo é "você tentou demais" (429);
#   · a página de erro do nginx NÃO carrega cabeçalho de CORS, então o navegador bloqueia a
#     resposta e o `fetch` do site estoura como falha de rede — a tela mostrava "não foi possível
#     conectar ao servidor" enquanto a API estava perfeitamente no ar.
limit_req_status 429;

# Origens do produto. O cabeçalho precisa existir TAMBÉM nas respostas de erro geradas pelo
# próprio nginx (429), senão o navegador esconde do JavaScript o motivo real da recusa.
map $http_origin $nainer_cors {
    default "";
    "https://nainer.com.br"       $http_origin;
    "https://www.nainer.com.br"   $http_origin;
    "https://app.nainer.com.br"   $http_origin;
    "https://admin.nainer.com.br" $http_origin;
}

# ⚠️ CORS DUPLICADO É PIOR QUE CORS AUSENTE: o navegador recusa a resposta quando o cabeçalho
# aparece duas vezes, e o fetch estoura como falha de rede — a mesma tela de "não foi possível
# conectar" que o cabeçalho ausente produz. Aconteceu duas vezes em 2026-08-19: primeiro por
# somar o cabeçalho do nginx ao que o Spring já mandava; depois, na correção, por condicionar
# ao STATUS — e a aplicação TAMBÉM responde 429 (LimiteRequisicaoFilter), justamente na resposta
# que mais precisa chegar íntegra ao visitante.
#
# O critério certo não é o status, é a ORIGEM DA RESPOSTA: só acrescenta o cabeçalho quando a
# resposta NÃO veio da aplicação. `$upstream_http_access_control_allow_origin` fica vazio quando
# o nginx respondeu sozinho (429 do limit_req, 502/504 com a API fora do ar) — e é exatamente
# nesses casos que o cabeçalho falta. add_header com valor vazio não é enviado.
map $upstream_http_access_control_allow_origin $nainer_cors_falta {
    default "";            # a aplicação respondeu e já mandou o dela — não duplicar
    ""      $nainer_cors;  # resposta gerada pelo próprio nginx — o cabeçalho falta
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------------------------------------------------------------------------------------------
# Redireciona http → https para todos os hosts. O bloco .well-known fica ANTES do redirect
# porque é por onde a Let's Encrypt valida (HTTP-01) — redirecionar isso quebra a renovação.
# ---------------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nainer.com.br www.nainer.com.br app.nainer.com.br admin.nainer.com.br api.nainer.com.br
                niner.com.br www.niner.com.br;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------------------------
# Cabeçalhos comuns. HSTS só depois que o HTTPS estiver funcionando de verdade — ligar antes
# tranca o navegador do visitante num host que ainda não serve TLS.
# ---------------------------------------------------------------------------------------------
map $host $niner_noindex { default ""; }   # sobrescrito por host abaixo

# =============================== SITE PÚBLICO (apex) ==========================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nainer.com.br;

    ssl_certificate     /etc/letsencrypt/live/nainer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nainer.com.br/privkey.pem;

    root /var/www/nainer/site;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Astro gera diretórios com index.html; sem isto, /termos daria 404.
    location / { try_files $uri $uri/ $uri.html $uri/index.html =404; }

    # Imagem e fonte podem ter cache longo (nome muda quando o conteúdo muda).
    location ~* \.(jpg|jpeg|png|webp|svg|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    # config.js NÃO pode ser cacheado: é o que permite trocar o endereço da API sem rebuild.
    location = /config.js { expires -1; add_header Cache-Control "no-store"; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nainer.com.br;
    ssl_certificate     /etc/letsencrypt/live/nainer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nainer.com.br/privkey.pem;
    # Um canônico só: o apex. Duas versões indexadas dividem o SEO da landing.
    return 301 https://nainer.com.br$request_uri;
}

# =============================== DOMÍNIO DEFENSIVO (niner.com.br) =============================
# Registrado para proteger a marca e capturar quem digita o nome sem o "a". Ele NÃO serve
# conteúdo: redireciona tudo para o domínio principal, com 301 (permanente).
#
# Por que 301 e não servir o site nos dois: dois domínios com o mesmo conteúdo dividem o sinal de
# SEO e competem entre si na busca — e a landing é o canal de aquisição. Um canônico só.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name niner.com.br www.niner.com.br;

    ssl_certificate     /etc/letsencrypt/live/niner.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niner.com.br/privkey.pem;

    return 301 https://nainer.com.br$request_uri;
}

# =============================== ERP DO LOJISTA ===============================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.nainer.com.br;

    ssl_certificate     /etc/letsencrypt/live/app.nainer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nainer.com.br/privkey.pem;

    root /var/www/nainer/web;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # App indexado dilui o SEO da landing, que é o canal de aquisição.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA: qualquer rota cai no index.html (o React Router resolve).
    location / { try_files $uri $uri/ /index.html; }
    location = /config.js { expires -1; add_header Cache-Control "no-store"; }
    location /assets/ { expires 365d; add_header Cache-Control "public, immutable"; }
}

# =============================== BACKOFFICE ===================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.nainer.com.br;

    ssl_certificate     /etc/letsencrypt/live/admin.nainer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.nainer.com.br/privkey.pem;

    root /var/www/nainer/admin;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 🔒 Segunda tranca, além do login de staff: restrinja por IP enquanto não houver VPN.
    # Descomente e ajuste — ferramenta interna não precisa estar aberta ao mundo.
    # allow 200.0.0.0/24;   # rede da Vetor
    # allow 127.0.0.1;
    # deny all;

    location / { try_files $uri $uri/ /index.html; }
    location = /config.js { expires -1; add_header Cache-Control "no-store"; }
    location /assets/ { expires 365d; add_header Cache-Control "public, immutable"; }
}

# =============================== API ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.nainer.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.nainer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nainer.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # `always` é o que faz o cabeçalho valer nas respostas de erro do próprio nginx (429/503).
    # $nainer_cors_falta (não $nainer_cors): quando a resposta vem da aplicação ela já traz o
    # cabeçalho, e duplicado o navegador recusa. Ver o comentário do map, no topo.
    add_header Access-Control-Allow-Origin $nainer_cors_falta always;
    add_header Vary Origin always;

    # O 429 do limit_req sai como página HTML do nginx. O front faz response.json() e estoura
    # no meio do tratamento do erro — some a mensagem "aguarde um instante" que existia pra ser
    # lida. Sem `=`, o status 429 é preservado e só o CORPO vem do arquivo.
    error_page 429 /429.json;
    location = /429.json {
        internal;
        root /var/www/nainer/erro;
        # `types { }` zera o mapa de extensões: sem isso o .json casa com mime.types e sai como
        # application/json, perdendo o content-type de Problem Details (RFC 9457).
        types { }
        default_type application/problem+json;
        add_header Retry-After 60 always;
        add_header Access-Control-Allow-Origin $nainer_cors_falta always;
        add_header Vary Origin always;
    }

    # Upload de foto de produto e planilha de importação: o app não impõe limite (decisão de
    # 2026-08-10), então o proxy também não pode impor um baixo em silêncio.
    client_max_body_size 64m;
    proxy_read_timeout 120s;

    # Sem estes cabeçalhos o app enxerga o IP do proxy: o limite por IP e o registro de
    # aquisição contariam todo mundo como um visitante só.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Escrita anônima: o alvo natural de robô.
    location /api/publico/eventos {
        limit_req zone=beacon burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/publico/ {
        limit_req zone=publico burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # ⚠️ Webhook de gateway FORA do limite: recusar notificação é perder confirmação de pagamento.
    location /api/publico/webhooks/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Backoffice: enquanto não houver VPN, restrinja por IP aqui também — a API é o que
    # realmente expõe os dados (nome, e-mail e WhatsApp de leads).
    location /api/admin/ {
        # allow 200.0.0.0/24;
        # deny all;
        limit_req zone=geral burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=geral burst=120 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
