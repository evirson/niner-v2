# Overrides de teste. O datasource vem do Testcontainers (@ServiceConnection),
# conectando como o superusuário do container.
# NB: este arquivo SOMBREIA src/main/resources/application.yml no classpath de teste —
# por isso o bloco `niner` precisa ser repetido aqui.
spring:
  # Nos testes o Flyway aplica as migrations reais de db/migration (validação em CI).
  # Em produção a app NÃO roda Flyway (fica com o serviço `flyway` do compose, P8).
  flyway:
    enabled: true
    locations: filesystem:../db/migration

niner:
  jwt:
    secret: niner-test-secret-0123456789abcdef0123456789abcdef
    expiracao: PT8H
    emissor: niner
  trial:
    dias: 60
    plano: Profissional
  limite-requisicao:
    # Desligado por padrão nos testes: a suíte faz dezenas de signups seguidos do mesmo "IP".
    # LimiteRequisicaoTest liga via @DynamicPropertySource com limite baixo.
    habilitado: false
  staff-inicial:               # vazio nos testes: cada teste cria o staff que precisa
    email: ""
    senha: ""
    nome: Administrador Teste
  cobranca:
    # Este arquivo SOMBREIA o application.yml de produção (ver nota no topo), então o bloco
    # precisa existir aqui também. Token vazio = cobrança desligada por padrão nos testes;
    # CobrancaMercadoPagoTest sobrescreve via @DynamicPropertySource apontando para um
    # Mercado Pago falso.
    gateway: mercadopago
    mercadopago:
      base-url: http://localhost:1
      access-token: ""
      webhook-secret: ""
      notification-url: ""
      validade-pix: PT24H
  canais:
    # Este arquivo SOMBREIA o application.yml de producao (ver nota no topo), entao o bloco
    # precisa existir aqui tambem. Sem credencial por padrao = integracao desligada;
    # MercadoLivreOAuthTest sobrescreve via @DynamicPropertySource apontando para um ML falso.
    mercadolivre:
      client-id: ""
      client-secret: ""
      redirect-uri: https://api.nainer.com.br/api/publico/canais/mercadolivre/retorno
      auth-url: https://auth.mercadolivre.com.br
      api-url: http://localhost:1
      retorno-web: http://localhost:5173/canais
  cors:
    origins:
      - http://localhost:5175
  storage:
    bucket: niner-erp-dev
    base-url: https://storage.googleapis.com
    # ADR-014. Nenhum teste do contexto Spring fala com o MinIO: o bean S3Client é @Lazy, então
    # estes valores nunca chegam a ser usados aqui. Quem exercita o armazenamento privado de
    # verdade é o ArmazenamentoPrivadoTest, que sobe o próprio container e monta o adapter à mão.
    privado:
      endpoint: http://localhost:9300
      access-key: niner_app
      secret-key: dev_minio_app
      regiao: us-east-1
      bucket-fiscal: niner-fiscal-test
      bucket-privado: niner-privado-test
  arquivo-compartilhado:
    expiracao-horas: 24
  seguranca:
    chave-segredos: bmluZXItdGVzdC1jaGF2ZS1zZWNyZXRhLWZpc2NhbDI=
  fiscal:
    # Vazio = truststore padrão do JDK. O teste de transporte injeta a sua própria (o servidor
    # HTTPS local usa certificado autoassinado), então este default não é usado por ele.
    truststore-path: ""
    truststore-senha: ""
    resp-tec:
      cnpj: "37829453000135"
      contato: MITRYUSCASH
      email: suporte@nainer.com.br
      telefone: "4133334444"
      # UF do CSRT de fallback abaixo (a fonte real e cfg_csrt_resptec, por UF x ambiente).
      uf: PR
      # CSRT de teste — valor sem significado, só precisa existir: a NF-e modelo 55 é recusada na
      # montagem sem ele (cStat 975 na SEFAZ real). O CSRT de verdade é segredo e nunca entra aqui.
      id-csrt: "01"
      csrt: CSRTDETESTENAOEOVALORREAL0123456789
