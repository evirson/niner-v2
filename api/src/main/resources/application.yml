spring:
  application:
    name: niner-api

  # A API conecta como niner_app (SEM BYPASSRLS) — P8. Overridable por env no compose.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/niner_db}
    username: ${SPRING_DATASOURCE_USERNAME:niner_app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_app}

  # Migrations NÃO rodam pela app: são aplicadas como niner_owner pelo serviço
  # `flyway` do docker-compose (P8: a app nunca roda migration nem é dona de tabela).
  flyway:
    enabled: false

  # I/O de integração com marketplaces/gateway (§3.2).
  threads:
    virtual:
      enabled: true

  # Erros no formato Problem Details (RFC 9457).
  mvc:
    problemdetails:
      enabled: true

  # Upload de foto de produto (ADR-013) e CSV da Rotina de Importação de Dados (carga inicial de
  # migração). Sem limite (2026-08-10, pedido explícito do dono do produto): a planilha de
  # migração não deve ser truncada nem rejeitada por tamanho de arquivo/número de linhas.
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Config do Niner (JWT e trial). O segredo é HS256 (>=256 bits); em produção via secret manager.
niner:
  jwt:
    secret: ${NINER_JWT_SECRET:niner-dev-secret-troque-em-producao-0123456789abcdef}
    expiracao: PT8H            # validade do access token
    emissor: niner
  trial:
    dias: 60                   # trial sem cartão (D2 — revisto de 14 para 60 dias)
    plano: Profissional        # plano-base durante o trial (fallback: menor preço ativo)
  cors:
    origins:                   # fronts em dev (site/web/admin). Em prod: domínios reais.
      - http://localhost:5175
      - http://localhost:5173
      - http://localhost:5174
  storage:                     # object storage das fotos de produto (ADR-013)
    bucket: ${NINER_STORAGE_BUCKET:niner-erp-dev}
    # host vazio = GCS real (ADC/chave). Preenchido = emulador fake-gcs-server do compose,
    # SEM credencial (dev): NINER_STORAGE_HOST=http://localhost:4443 e nada mais — a base-url
    # herda o host automaticamente, então as URLs públicas das fotos já saem do emulador.
    host: ${NINER_STORAGE_HOST:}
    base-url: ${NINER_STORAGE_BASE_URL:${NINER_STORAGE_HOST:https://storage.googleapis.com}}
    # DF21: bucket SEPARADO e PRIVADO para os XML AUTORIZADOS (guarda legal de 5 anos, com
    # versionamento/retenção) — nunca o de fotos acima, que é de leitura pública de propósito.
    # Mesmo host/credencial, nome diferente. ⚠️ O certificado digital NÃO vem para cá: fica
    # cifrado no banco (fiscal_certificado.arquivo_cifrado), DF21 revisada em 2026-08-17.
    # 🔴 Bucket real ainda não provisionado — dados vêm do dono do produto.
    bucket-fiscal: ${NINER_STORAGE_BUCKET_FISCAL:niner-fiscal-dev}
  arquivo-compartilhado:       # cache temporário em memória (ex.: comprovante por link do WhatsApp)
    expiracao-horas: ${NINER_ARQUIVO_COMPARTILHADO_EXPIRACAO_HORAS:24}
  seguranca:
    # AES-256-GCM para cifrar segredos de terceiro em repouso (F7) — hoje só a senha do
    # certificado fiscal. Base64 de 32 bytes. O valor abaixo é só de DEV — TROQUE EM PRODUÇÃO
    # (secret manager / variável de ambiente do compose, nunca commitado).
    chave-segredos: ${NINER_CHAVE_SEGREDOS:bmluZXItZGV2LWNoYXZlLXNlY3JldGEtZmlzY2FsMzI=}
  fiscal:
    # ⚠️ Requisito de ambiente em PRODUÇÃO: a raiz da ICP-Brasil NÃO vem no cacerts do JDK.
    # Sem truststore própria, toda chamada à SEFAZ falha com "PKIX path building failed" —
    # erro que não menciona ICP-Brasil e faz suspeitar do certificado do lojista (achado do B0).
    # Vazio = truststore padrão do JDK (serve para teste local, não para a SEFAZ real).
    truststore-path: ${NINER_FISCAL_TRUSTSTORE:}
    truststore-senha: ${NINER_FISCAL_TRUSTSTORE_SENHA:}
    # infRespTec (B7): o responsável técnico é a VETOR/MITRYUSCASH, o mesmo em toda nota de todo
    # tenant — nunca o lojista. CNPJ é o mesmo usado no B0 (homologação real na SEFAZ-PR).
    resp-tec:
      cnpj: ${NINER_FISCAL_RESPTEC_CNPJ:37829453000135}
      contato: ${NINER_FISCAL_RESPTEC_CONTATO:SUPORTE VETOR SISTEMAS}
      email: ${NINER_FISCAL_RESPTEC_EMAIL:suporte@vetorsistemas.com.br}
      telefone: ${NINER_FISCAL_RESPTEC_TELEFONE:4133334444}
