<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark Reader (2026-09-04): o ERP já tem tema claro/escuro próprio, com seletor na topbar.
         Sem esta tag a extensão repinta a página inteira por cima — medido na máquina do dono do
         produto: com o seletor em "claro" e os tokens corretos (`--ground: #d8e9f0`), o `<body>`
         pintava `rgb(23,49,60)`, vindo de 9 folhas `<style class="darkreader…">` que ela injeta.
         Remover essas folhas em runtime não adianta: medido, ela reinjeta 8 em segundos.
         `darkreader-lock` é o mecanismo oficial para a página dizer "eu me temo sozinha".
         ⚠️ Ela também contaminava o PDF dos relatórios (fundo `#18191b`, o
         `--darkreader-neutral-background` dela). A limpeza em `paletaDeImpressaoParaCaptura.ts`
         continua existindo de propósito: esta tag depende de a extensão estar atualizada e de
         nenhuma outra fazer o mesmo, e relatório que sai da máquina não pode depender disso. -->
    <meta name="darkreader-lock" />
    <title>Nainer — ERP</title>
    <!-- base-URL da API lida em runtime, não embutida (spec §3.1) -->
    <script src="/config.js"></script>
    <!-- Tema (2026-08-14): aplicado ANTES da primeira pintura, de propósito duplicado em JS puro
         aqui em vez de reaproveitar `src/lib/tema.ts`. O bundle do React só roda depois que o
         browser já pintou o `<body>` com a paleta padrão — quem escolheu "claro" veria um flash
         escuro a cada F5 (FOUC). Este trecho tem de ficar inline e síncrono no <head>;
         qualquer mudança na regra de gravação precisa ser refletida nos dois lugares. -->
    <script>
      (function () {
        var t = localStorage.getItem('niner_tema')
        if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light')
        else if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark')
        // Sem valor salvo = "automático": nenhum atributo, a media query prefers-color-scheme
        // decide (comportamento histórico do ERP).
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
