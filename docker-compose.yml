# docker-compose.yml (dev) — spec §3.5
# Infra de dados + API. Ordem de subida: db → flyway (migrations) → api.
# Os serviços web/admin/site entram quando os fronts forem scaffolded.
#
# Uso:
#   docker compose up -d db          # sobe o banco (bootstrap de roles roda no 1º init)
#   docker compose run --rm flyway   # aplica as migrations db/migration/ como niner_owner
#   docker compose up -d api         # sobe a API (conecta como niner_app, porta 8080)

name: niner

services:
  db:
    image: postgres:18
    container_name: niner-db
    environment:
      POSTGRES_DB: niner_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_postgres}   # 🔴 dev; produção via secret manager
      # Senhas das roles do bootstrap. Em dev ficam nos valores conhecidos; em produção vêm do
      # .env do servidor (ver docker-compose.prod.yml).
      NINER_OWNER_PASSWORD: ${FLYWAY_OWNER_PASSWORD:-dev_owner}
      NINER_APP_PASSWORD: ${DB_APP_PASSWORD:-dev_app}
      NINER_BACKUP_PASSWORD: ${NINER_BACKUP_SENHA:-dev_backup}
    volumes:
      # postgres:18 mudou o VOLUME para /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      # 00_roles.sql roda uma única vez no primeiro init, como superusuário, já em niner_db
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    ports: ["${NINER_DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d niner_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Flyway roda como niner_owner (P8: niner_app nunca roda migration nem é dono de tabela)
  flyway:
    image: flyway/flyway:11
    profiles: [migrate]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./db/migration:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://db:5432/niner_db
      -user=niner_owner
      -password=${FLYWAY_OWNER_PASSWORD:-dev_owner}
      -connectRetries=10
      migrate

  # API Nainer (Spring Boot 4 / Java 25). Conecta como niner_app (SEM BYPASSRLS, P8).
  # As migrations devem ter sido aplicadas antes: `docker compose run --rm flyway`.
  api:
    build: ./api
    container_name: niner-api
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/niner_db
      SPRING_DATASOURCE_USERNAME: niner_app
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:-dev_app}
      # Object storage das fotos de produto (ADR-013). Opção B do handoff (chave de conta de
      # serviço) — dentro do container não existe ~/.config/gcloud do host, então a Opção A
      # (ADC pessoal) só funciona rodando a API direto no host (`./mvnw spring-boot:run`).
      # Sem chave em api/secrets/, a variável aponta pra um arquivo que não existe — isso só
      # falha quando alguém tenta gravar/apagar uma imagem de verdade (cliente do GCS é lazy),
      # nunca na subida do container.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcs-niner-erp.json
      # Opção C (dev sem credencial nenhuma, docs/infra/armazenamento-imagens.md §3): com o
      # serviço `fake-gcs` no ar, a API fala com ele (rede interna do compose) e as URLs
      # públicas saem pela porta mapeada em localhost (o que o navegador do host consegue
      # resolver — "fake-gcs" só existe dentro da rede do Docker). Vazio (produção) = GCS real.
      NINER_STORAGE_HOST: ${NINER_STORAGE_HOST:-}
      NINER_STORAGE_BASE_URL: ${NINER_STORAGE_BASE_URL:-}
      # Object storage PRIVADO (ADR-014) — MinIO. Dentro da rede do compose o endereço é
      # http://minio:9000; rodando a API no host, é http://localhost:9300 (a porta publicada) —
      # que é justamente o default de application.yml, então lá não precisa exportar nada.
      # A credencial NÃO é a root do MinIO: é o usuário criado pelo minio-init, sem permissão de
      # apagar no bucket fiscal e sem bypass de retenção.
      NINER_STORAGE_PRIVADO_ENDPOINT: ${NINER_STORAGE_PRIVADO_ENDPOINT:-http://minio:9000}
      NINER_STORAGE_PRIVADO_ACCESS_KEY: ${NINER_STORAGE_PRIVADO_ACCESS_KEY:-niner_app}
      NINER_STORAGE_PRIVADO_SECRET_KEY: ${NINER_STORAGE_PRIVADO_SECRET_KEY:-dev_minio_app}
      NINER_STORAGE_BUCKET_FISCAL: ${NINER_STORAGE_BUCKET_FISCAL:-niner-fiscal-dev}
      NINER_STORAGE_BUCKET_PRIVADO: ${NINER_STORAGE_BUCKET_PRIVADO:-niner-privado-dev}
      # Truststore da ICP-Brasil (B0) — sem ela, mTLS contra a SEFAZ real falha com "PKIX path
      # building failed" (a raiz ICP-Brasil não vem no cacerts do JDK). Arquivo em api/secrets/
      # (montado acima, gitignored), senha padrão do keytool para truststore criada sem -storepass.
      NINER_FISCAL_TRUSTSTORE: ${NINER_FISCAL_TRUSTSTORE:-}
      NINER_FISCAL_TRUSTSTORE_SENHA: ${NINER_FISCAL_TRUSTSTORE_SENHA:-}
      # CSRT do responsável técnico (NT 2018.005) — obtido pela VETOR no portal da SEFAZ da UF.
      # ⚠️ SEGREDO: o valor mora no .env (gitignored), nunca aqui. Sem ele a NF-e modelo 55 de
      # devolução é recusada na montagem (e seria recusada pela SEFAZ com cStat 975).
      NINER_FISCAL_RESPTEC_ID_CSRT: ${NINER_FISCAL_RESPTEC_ID_CSRT:-}
      NINER_FISCAL_RESPTEC_CSRT: ${NINER_FISCAL_RESPTEC_CSRT:-}
      # ⛔ Emissor da NFS-e. Sem esta linha a variável NUNCA chegava ao container (2026-09-01), e
      # o `matchIfMissing = true` do EmissorFalso vencia SEMPRE: rodando pelo compose, a NFS-e era
      # simulada mesmo com a loja configurada e o certificado no lugar — e nada na tela dizia isso.
      # O padrão continua `falso`, que é a decisão do application.yml: emitir NFS-e é ato fiscal
      # com o CNPJ do lojista. Quem emite de verdade põe `nacional` no .env, conscientemente.
      NINER_NFSE_EMISSOR: ${NINER_NFSE_EMISSOR:-falso}
      # Primeiro SUPER_ADMIN do backoffice (StaffBootstrap). Sem estas três, `plataforma.staff`
      # nasce vazia e o `admin/` sobe mas NINGUÉM consegue entrar — a API avisa em WARN na subida,
      # e a única saída seria um INSERT com hash BCrypt na mão. Só é usado quando a tabela está
      # vazia: nunca recria nem redefine senha de quem já existe. Senha mínima de 12 caracteres.
      NINER_STAFF_INICIAL_EMAIL: ${NINER_STAFF_INICIAL_EMAIL:-}
      NINER_STAFF_INICIAL_SENHA: ${NINER_STAFF_INICIAL_SENHA:-}
      NINER_STAFF_INICIAL_NOME: ${NINER_STAFF_INICIAL_NOME:-Administrador Vetor}

    volumes:
      - ./api/secrets:/secrets:ro
    ports: ["${NINER_API_PORT:-8080}:8080"]

  # Emulador de GCS para dev SEM credencial (ADR-013) — mesmo fsouza/fake-gcs-server que o
  # ProdutoImagemCrudTest usa via Testcontainers. Com ele no ar, a API roda com
  # NINER_STORAGE_HOST=http://localhost:4443 e o upload/exclusão/exibição de fotos de produto
  # funciona de ponta a ponta sem gcloud/ADC/chave (docs/infra/armazenamento-imagens.md §3,
  # Opção C). Backend em filesystem + volume: as imagens sobrevivem a restart do container.
  #   docker compose up -d fake-gcs
  fake-gcs:
    image: fsouza/fake-gcs-server:1.49
    container_name: niner-fake-gcs
    # -public-host é o endereço que aparece nas URLs devolvidas pelo emulador, então tem que
    # ser a porta publicada no host (o que o navegador resolve), não a interna do container.
    command: ["-scheme", "http", "-public-host", "localhost:${NINER_FAKE_GCS_PORT:-4443}", "-backend", "filesystem", "-filesystem-root", "/storage"]
    volumes:
      - fake-gcs-data:/storage
    ports: ["${NINER_FAKE_GCS_PORT:-4443}:4443"]

  # Object storage PRIVADO (ADR-014) — MinIO, S3-compatível, auto-hospedado.
  # ⚠️ NÃO confundir com o `fake-gcs` acima: aquele é um EMULADOR do bucket PÚBLICO das fotos de
  # produto (que continuam no GCS, ADR-013). Este aqui é armazenamento de verdade — o mesmo
  # software que vai rodar no VPS — e guarda o que não pode ser público: XML fiscal (guarda legal
  # de 5 anos, imutável — F6/DF21) e dado pessoal (foto de cliente, LGPD).
  #   docker compose up -d minio minio-init     → API S3 na 9300, console web na 9301
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: niner-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # 🔴 dev. Em produção: secret manager, e a conta root NÃO é a que a API usa (ver minio-init).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-niner_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_root}
    volumes:
      - minio-data:/data
    ports:
      - "${NINER_MINIO_PORT:-9300}:9000"            # API S3 (é esta que a API consome)
      - "${NINER_MINIO_CONSOLE_PORT:-9301}:9001"    # console web (inspeção manual)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Bootstrap do MinIO — cria os dois buckets com as políticas certas e a credencial de menor
  # privilégio da API. Roda uma vez e sai (é um job, não um serviço); é idempotente, então pode
  # ser reexecutado à vontade. O que ele garante está em infra/minio/bootstrap.sh.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: niner-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-niner_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_root}
      BUCKET_FISCAL: ${NINER_STORAGE_BUCKET_FISCAL:-niner-fiscal-dev}
      BUCKET_PRIVADO: ${NINER_STORAGE_BUCKET_PRIVADO:-niner-privado-dev}
      RETENCAO_FISCAL_DIAS: ${NINER_FISCAL_RETENCAO_DIAS:-1825}   # 5 anos (arts. 173/174 do CTN)
      # Bucket privado é versionado, então apagar só cria um "delete marker": a versão antiga
      # some de verdade depois destes dias (LGPD — exclusão precisa apagar mesmo).
      VERSAO_ANTIGA_DIAS: ${NINER_PRIVADO_VERSAO_ANTIGA_DIAS:-30}
      APP_ACCESS_KEY: ${NINER_STORAGE_PRIVADO_ACCESS_KEY:-niner_app}
      APP_SECRET_KEY: ${NINER_STORAGE_PRIVADO_SECRET_KEY:-dev_minio_app}
    volumes:
      - ./infra/minio:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    restart: "no"

  # pgAdmin — cliente web para inspecionar o niner_db em dev. Perfil `tools` (não sobe por padrão).
  #   docker compose --profile tools up -d pgadmin   → http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: niner-pgadmin
    profiles: [tools]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@niner.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dev_pgadmin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports: ["${NINER_PGADMIN_PORT:-5050}:80"]

  # Site público (Astro/SSG, SEO — ADR-011). Dev server na 5175. Perfil `fronts`.
  # A base-URL da API é lida em runtime (site/public/config.js).
  site:
    image: node:26-alpine
    profiles: [fronts]
    working_dir: /app
    environment:
      # Mesmo motivo do serviço  (2026-07-21) — e aqui a falta mordeu em 2026-08-27: a
      # página servida continuava sendo a antiga depois de editar o arquivo no host, sem erro
      # nenhum, o que parece bug do código e é o watcher não vendo a mudança.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./site:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["${NINER_SITE_PORT:-5175}:5175"]

  # App do ERP do lojista (React + Vite). Dev server na 5173. Perfil `fronts`.
  web:
    image: node:26-alpine
    profiles: [fronts]
    working_dir: /app
    environment:
      # Bind mount do Docker Desktop no Windows não propaga eventos de arquivo de forma
      # confiável para o watcher (chokidar) dentro do container — sem isso, edições feitas
      # no host (fora do container) podem não aparecer no HMR do Vite (2026-07-21).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["${NINER_WEB_PORT:-5173}:5173"]

  # Backoffice da plataforma (React + Vite). Dev server na 5174. Perfil `fronts`.
  # ⚠️ Ferramenta interna: em produção NÃO publicar sem restrição de acesso (VPN/allowlist),
  # mesmo com o login de staff — ver docs/infra/checklist-producao.md.
  admin:
    image: node:26-alpine
    profiles: [fronts]
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./admin:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["${NINER_ADMIN_PORT:-5174}:5174"]

volumes:
  pgdata:
  pgadmin-data:
  fake-gcs-data:
  # ⚠️ Apagar este volume apaga XML fiscal — em dev é só perda de teste, em produção é
  # problema legal do lojista. O `docker compose down -v` leva ele junto.
  minio-data:
